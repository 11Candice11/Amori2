# Shared logging policy. Docker's json-file driver is size-based only (no
# native "delete after N days"), so we cap size here as a safety net that
# prevents a log burst from filling the disk between cleanups. True 2-day
# age-based deletion is enforced by the daily cron in scripts/prune-docker-logs.sh
# (installed on the host) which truncates container logs older than 2 days.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"   # per file
    max-file: "3"     # keep at most 3 rotated files per container

services:
  postgres:
    image: postgres:16-alpine
    container_name: amori-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Bind to loopback only — Postgres is NOT exposed to the public internet.
    # The api container reaches it over the internal docker network.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - amori-network

  api:
    # Image is built locally (linux/amd64) and loaded onto the host via
    # `docker load` — we do NOT build on the instance (small root disk).
    image: amori-api:latest
    container_name: amori-api
    restart: unless-stopped
    logging: *default-logging
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5001
      - Database__ConnectionString=Host=amori-postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Jwt__SecretKey=${JWT_SECRET_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Jwt__ExpiryMinutes=60
      - Jwt__RefreshTokenExpiryDays=7
      # Allow the mobile app origins through CORS (RN dev + generic).
      - Cors__AllowedOrigins__0=http://localhost:8081
    ports:
      - "5001:5001"
      # NOTE: We do NOT publish port 80 from the container. nginx runs on the
      # host, owns :80 and :443 (TLS via Certbot for amori.ycare.org) and
      # reverse-proxies to 127.0.0.1:5001. Publishing 80 here collides with
      # nginx ("address already in use") and is unnecessary — public traffic
      # reaches the API through nginx on 443, not the container's :80.
    volumes:
      # Uploaded images live on disk when S3 isn't configured. Keep them in a
      # named volume so they survive container rebuilds/redeploys.
      - api_uploads:/app/wwwroot/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - amori-network

volumes:
  postgres_data:
  api_uploads:

networks:
  amori-network:
    name: amori-network
    driver: bridge
